services:
  - type: web
    name: uae-careers-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: uae-careers/api
    buildCommand: npm install && ./node_modules/.bin/prisma generate
    startCommand: ./node_modules/.bin/prisma migrate deploy && node src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000

      # ── Copy these from Railway ──────────────────────────────
      - key: DATABASE_URL
        sync: false          # paste your Supabase connection string
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false          # https://www.uaecareer.ae

      # ── Email ────────────────────────────────────────────────
      - key: RESEND_API_KEY
        sync: false

      # ── SMS/OTP (Twilio) ─────────────────────────────────────
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false

      # ── Storage (Backblaze B2) ───────────────────────────────
      - key: B2_APPLICATION_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: B2_BUCKET_ID
        sync: false
      - key: B2_BUCKET_NAME
        sync: false
      - key: B2_ENDPOINT
        sync: false

      # ── Payments ─────────────────────────────────────────────
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MODE
        value: production
